<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Depósito Avalos — Comprobantes</title>
<style>
  :root{
    --bg:#12100e; --card:#1e1a16; --line:#33291f; --ink:#f4ece2; --muted:#b7a893;
    --accent:#e0813e; --accent2:#c85a22; --ok:#3fbf7f; --err:#e9857c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:460px;margin:0 auto;padding:18px 16px 40px}
  .brand{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
  .logo{width:46px;height:46px;border-radius:11px;flex:none;display:flex;align-items:center;
    justify-content:center;font-weight:800;font-size:19px;color:#fff;
    background:linear-gradient(150deg,#f0813e,#c85a22 70%)}
  .brand h1{font-size:17px;margin:0;line-height:1.1}
  .brand small{color:var(--muted);font-size:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;font-weight:600}
  input,select,button{font-size:16px;font-family:inherit}
  input[type=password],input[type=text],select{width:100%;background:#15120f;border:1px solid var(--line);
    border-radius:11px;padding:13px 14px;color:var(--ink);outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .btn{width:100%;border:none;border-radius:12px;padding:15px;font-weight:700;color:#fff;
    background:var(--accent2);margin-top:14px;cursor:pointer}
  .btn:active{opacity:.85}
  .btn.sec{background:#2a231c;color:var(--ink);border:1px solid var(--line)}
  .btn:disabled{opacity:.5}
  .info{background:#211a12;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
  .info b{color:var(--accent)}
  .msg{padding:11px 13px;border-radius:11px;margin-top:12px;font-size:14px;display:none}
  .msg.ok{background:#122a1f;color:var(--ok);border:1px solid #1e4433;display:block}
  .msg.err{background:#2a1512;color:var(--err);border:1px solid #47201c;display:block}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .thumbs .t{position:relative;width:72px;height:72px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
  .thumbs img{width:100%;height:100%;object-fit:cover}
  .thumbs .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;
    border-radius:50%;width:20px;height:20px;line-height:18px;font-size:13px}
  .hidden{display:none}
  .cam{display:block;text-align:center;border:1.5px dashed var(--line);border-radius:12px;
    padding:22px;color:var(--muted);margin-top:6px}
  .cam b{color:var(--accent)}
  .foot{text-align:center;color:var(--muted);font-size:11px;margin-top:18px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;
    border-radius:50%;animation:g .7s linear infinite;vertical-align:-3px;margin-right:6px}
  @keyframes g{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo">DA</div>
    <div><h1>Depósito Avalos</h1><small>Subir factura / remito</small></div>
  </div>

  <!-- Paso 1: PIN -->
  <div class="card" id="pantPin">
    <label>PIN de acceso</label>
    <input type="password" id="pin" inputmode="numeric" placeholder="PIN" autocomplete="off">
    <button class="btn" id="btnEntrar">Entrar</button>
    <div class="msg" id="msgPin"></div>
  </div>

  <!-- Paso 2: subir -->
  <div class="card hidden" id="pantSubir">
    <div class="info" id="info"></div>
    <label>¿Qué es?</label>
    <select id="tipo">
      <option value="factura">Factura</option>
      <option value="remito">Remito</option>
      <option value="otro">Otro</option>
    </select>

    <label style="margin-top:14px">Fotos o archivos</label>
    <label class="cam" for="file">📷 <b>Tocá para sacar una foto</b><br><small>o elegir un archivo (PDF/imagen)</small></label>
    <input id="file" type="file" accept="image/*,application/pdf" capture="environment" multiple class="hidden">
    <div class="thumbs" id="thumbs"></div>

    <button class="btn" id="btnSubir" disabled>Subir</button>
    <button class="btn sec" id="btnOtro">Cargar otro ingreso</button>
    <div class="msg" id="msgSubir"></div>
  </div>

  <div class="foot">Depósito Avalos · carga de comprobantes</div>
</div>

<script>
const SUPA_URL = "https://ioycuhefaalpqivhhryb.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlveWN1aGVmYWFscHFpdmhocnliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3Mzc4MzEsImV4cCI6MjEwMjMxMzgzMX0.uI39JloL2X32WGPb9GzOTrO1netIRDYdah5OtuMTiyQ";
const FN = SUPA_URL + "/functions/v1/comprobante-cel";
const params = new URLSearchParams(location.search);
const ING = params.get("ing") || "";
let PIN = "";
let archivos = [];   // {nombre, mime, b64, preview}

function api(payload){
  return fetch(FN, {method:"POST",
    headers:{"Content-Type":"application/json","apikey":ANON,"Authorization":"Bearer "+ANON},
    body: JSON.stringify(payload)}).then(async r=>{
      const j = await r.json().catch(()=>({error:"Respuesta inválida"}));
      if(!r.ok) throw new Error(j.error||("Error "+r.status));
      return j;
    });
}
function show(el,txt,cls){el.textContent=txt;el.className="msg "+cls;}

document.getElementById("btnEntrar").onclick = async ()=>{
  const m=document.getElementById("msgPin");
  PIN = document.getElementById("pin").value.trim();
  if(!ING){ show(m,"El link no trae el ingreso. Escaneá el QR desde la app.","err"); return;}
  if(!PIN){ show(m,"Ingresá el PIN.","err"); return;}
  show(m,"","");
  try{
    const info = await api({accion:"info", pin:PIN, ingreso:ING});
    document.getElementById("info").innerHTML =
      `Ingreso <b>N° ${info.numero}</b>` + (info.proveedor?` · ${info.proveedor}`:"") +
      (info.fecha?` · ${info.fecha}`:"") + `<br><small>${info.adjuntos} adjunto(s) hasta ahora</small>`;
    document.getElementById("pantPin").classList.add("hidden");
    document.getElementById("pantSubir").classList.remove("hidden");
  }catch(e){ show(m, e.message, "err"); }
};

// Comprimir imagen con canvas (máx 1600px, JPEG 0.8). PDFs u otros: tal cual.
function procesar(file){
  return new Promise((res)=>{
    if(!file.type.startsWith("image/")){
      const fr=new FileReader();
      fr.onload=()=>res({nombre:file.name,mime:file.type||"application/octet-stream",
        b64:fr.result.split(",")[1], preview:null});
      fr.readAsDataURL(file); return;
    }
    const img=new Image();
    img.onload=()=>{
      const max=1600; let {width:w,height:h}=img;
      if(w>max||h>max){ if(w>h){h=Math.round(h*max/w);w=max;} else {w=Math.round(w*max/h);h=max;} }
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      const durl=cv.toDataURL("image/jpeg",0.8);
      res({nombre:(file.name||"foto").replace(/\.[^.]+$/,"")+".jpg", mime:"image/jpeg",
           b64:durl.split(",")[1], preview:durl});
    };
    img.src=URL.createObjectURL(file);
  });
}

document.getElementById("file").onchange = async (e)=>{
  for(const f of e.target.files){ archivos.push(await procesar(f)); }
  e.target.value="";
  pintarThumbs();
};
function pintarThumbs(){
  const t=document.getElementById("thumbs"); t.innerHTML="";
  archivos.forEach((a,i)=>{
    const d=document.createElement("div"); d.className="t";
    d.innerHTML = (a.preview?`<img src="${a.preview}">`:`<div style="padding:8px;font-size:11px;color:var(--muted)">📄<br>${a.nombre.slice(0,10)}</div>`)
      + `<button class="x" data-i="${i}">×</button>`;
    t.appendChild(d);
  });
  t.querySelectorAll(".x").forEach(b=>b.onclick=()=>{archivos.splice(+b.dataset.i,1);pintarThumbs();});
  document.getElementById("btnSubir").disabled = archivos.length===0;
}

document.getElementById("btnSubir").onclick = async ()=>{
  const m=document.getElementById("msgSubir"); const b=document.getElementById("btnSubir");
  const tipo=document.getElementById("tipo").value;
  b.disabled=true; b.innerHTML='<span class="spin"></span>Subiendo…';
  let ok=0, err=0;
  for(const a of archivos){
    try{ await api({accion:"subir",pin:PIN,ingreso:ING,tipo,nombre:a.nombre,mime:a.mime,data_base64:a.b64}); ok++; }
    catch(e){ err++; }
  }
  b.innerHTML="Subir"; b.disabled=false;
  if(err===0){ show(m,`¡Listo! ${ok} archivo(s) subido(s) al ingreso.`,"ok"); archivos=[]; pintarThumbs(); }
  else{ show(m,`${ok} subido(s), ${err} con error. Reintentá los que faltan.`,"err"); }
};
document.getElementById("btnOtro").onclick=()=>{ location.href = location.pathname; };

if(!ING){
  document.getElementById("msgPin").textContent="Abrí esta página escaneando el QR de un ingreso desde la app.";
  document.getElementById("msgPin").className="msg err";
}
</script>
</body>
</html>
